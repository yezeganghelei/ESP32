  <desc>Copyright 2026 Waveshare. Author: Wulu. Source: https://docs.waveshare.net/ESP32-MicroPython-Tutorials/Web-Server</desc>
  <metadata>Copyright 2026 Waveshare. Author: Wulu. Source: https://docs.waveshare.net/ESP32-MicroPython-Tutorials/Web-Server</metadata>
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">MicroPython Web Server 工作流程（含浏览器交互）</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Web Server 工作流程分两个阶段。灰色块为服务启动阶段（创建套接字、绑定地址端口、开始监听），只执行一次。蓝色块为通信循环阶段（接受连接、接收请求、发送响应、关闭连接），对每个客户端连接重复执行；其中 s.accept() 返回一个新的 conn 套接字用于本次通信。左侧珊瑚色块为浏览器（客户端），与循环阶段的四个步骤通过水平箭头交换数据：建立连接、HTTP 请求、HTTP 响应、断开连接。右侧回环箭头表示一个连接处理完后回到 accept，准备处理下一个连接。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="620" fill="#ffffff"/>

