<svg width="1360" height="720" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">

  <desc>Copyright 2026 Waveshare. Author: Wulu. Source: https://docs.waveshare.net/ESP32-Peripheral-Tutorials/Display/AMOLED</desc>
  <metadata>Copyright 2026 Waveshare. Author: Wulu. Source: https://docs.waveshare.net/ESP32-Peripheral-Tutorials/Display/AMOLED</metadata>
  <!-- 白色背景 -->
  <rect width="680" height="360" fill="white"/>
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowScan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- 面板标题 -->
  <text x="170" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" font-weight="bold">PMOLED（被动矩阵，逐行扫描）</text>
  <text x="510" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" font-weight="bold">AMOLED（有源矩阵）</text>

  <!-- 中间分隔线 -->
  <line x1="340" y1="30" x2="340" y2="330" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- ===== 左：PMOLED ===== -->
  <!-- 列电极（数据线，垂直） -->
  <text x="170" y="72" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">列电极（数据）</text>
  <line x1="110" y1="82" x2="110" y2="242" stroke="#9ca3af" stroke-width="1"/>
  <line x1="150" y1="82" x2="150" y2="242" stroke="#9ca3af" stroke-width="1"/>
  <line x1="190" y1="82" x2="190" y2="242" stroke="#9ca3af" stroke-width="1"/>
  <line x1="230" y1="82" x2="230" y2="242" stroke="#9ca3af" stroke-width="1"/>
  <!-- 行电极（扫描线，水平）；第 2 行正在被扫描 -->
  <line x1="88" y1="100" x2="252" y2="100" stroke="#9ca3af" stroke-width="1"/>
  <line x1="88" y1="140" x2="252" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="88" y1="180" x2="252" y2="180" stroke="#9ca3af" stroke-width="1"/>
  <line x1="88" y1="220" x2="252" y2="220" stroke="#9ca3af" stroke-width="1"/>
  <text x="256" y="144" text-anchor="start" font-family="Arial" font-size="9" fill="#333">正在扫描</text>

  <!-- 扫描方向：自上而下逐行 -->
  <line x1="70" y1="95" x2="70" y2="228" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowScan)"/>
  <text x="58" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#666" transform="rotate(-90 58 165)">逐行扫描</text>

  <!-- 像素：只有被扫描行上的像素点亮（按列数据），其余行全部熄灭 -->
  <!-- 第 1 行（未扫描，熄灭） -->
  <circle cx="110" cy="100" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="150" cy="100" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="190" cy="100" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="230" cy="100" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <!-- 第 2 行（正在扫描，按数据点亮） -->
  <circle cx="110" cy="140" r="9" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="110" y1="124" x2="110" y2="118"/>
    <line x1="97" y1="131" x2="93" y2="127"/>
    <line x1="123" y1="131" x2="127" y2="127"/>
  </g>
  <circle cx="150" cy="140" r="9" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="150" y1="124" x2="150" y2="118"/>
    <line x1="137" y1="131" x2="133" y2="127"/>
    <line x1="163" y1="131" x2="167" y2="127"/>
  </g>
  <circle cx="190" cy="140" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="230" cy="140" r="9" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="230" y1="124" x2="230" y2="118"/>
    <line x1="217" y1="131" x2="213" y2="127"/>
    <line x1="243" y1="131" x2="247" y2="127"/>
  </g>
  <!-- 第 3 行（未扫描，熄灭） -->
  <circle cx="110" cy="180" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="150" cy="180" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="190" cy="180" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="230" cy="180" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <!-- 第 4 行（未扫描，熄灭） -->
  <circle cx="110" cy="220" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="150" cy="220" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="190" cy="220" r="9" fill="#374151" stroke="#999" stroke-width="1"/>
  <circle cx="230" cy="220" r="9" fill="#374151" stroke="#999" stroke-width="1"/>

  <!-- 底部说明 -->
  <text x="170" y="304" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">行列共用电极，像素只在被扫描的瞬间点亮</text>
  <text x="170" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">行数越多，每行点亮时间越短，尺寸与分辨率受限</text>

  <!-- ===== 右：AMOLED ===== -->
  <!-- 行列信号线（浅色，仅在写入时使用） -->
  <line x1="405" y1="82" x2="405" y2="242" stroke="#d1d5db" stroke-width="1"/>
  <line x1="435" y1="82" x2="435" y2="242" stroke="#d1d5db" stroke-width="1"/>
  <line x1="465" y1="82" x2="465" y2="242" stroke="#d1d5db" stroke-width="1"/>
  <line x1="495" y1="82" x2="495" y2="242" stroke="#d1d5db" stroke-width="1"/>
  <line x1="392" y1="100" x2="508" y2="100" stroke="#d1d5db" stroke-width="1"/>
  <line x1="392" y1="140" x2="508" y2="140" stroke="#d1d5db" stroke-width="1"/>
  <line x1="392" y1="180" x2="508" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <line x1="392" y1="220" x2="508" y2="220" stroke="#d1d5db" stroke-width="1"/>

  <!-- 像素：写入后持续发光，任意分布的画面可同时保持 -->
  <!-- 第 1 行 -->
  <rect x="396" y="91" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="426" y="91" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="456" y="91" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="486" y="91" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <!-- 第 2 行 -->
  <rect x="396" y="131" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="426" y="131" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="456" y="131" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="486" y="131" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <!-- 第 3 行 -->
  <rect x="396" y="171" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="426" y="171" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="456" y="171" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="486" y="171" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <!-- 第 4 行 -->
  <rect x="396" y="211" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="426" y="211" width="18" height="18" rx="3" fill="#374151" stroke="#999" stroke-width="1"/>
  <rect x="456" y="211" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <rect x="486" y="211" width="18" height="18" rx="3" fill="#ffffff" stroke="#666" stroke-width="1.5"/>

  <text x="450" y="72" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">所有点亮的像素同时保持发光</text>

  <!-- 引出线：放大展示单个像素的电路 -->
  <line x1="504" y1="135" x2="545" y2="105" stroke="#999" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="504" y1="149" x2="545" y2="238" stroke="#999" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- 单个像素放大图 -->
  <rect x="545" y="88" width="122" height="155" rx="4" fill="#f9fafb" stroke="#999" stroke-width="1"/>
  <text x="606" y="104" text-anchor="middle" font-family="Arial" font-size="10" fill="#333" font-weight="bold">单个像素</text>

  <!-- 扫描线与数据线 -->
  <line x1="551" y1="118" x2="661" y2="118" stroke="#9ca3af" stroke-width="1"/>
  <text x="554" y="114" text-anchor="start" font-family="Arial" font-size="8" fill="#666">扫描线（控制开关）</text>
  <line x1="562" y1="124" x2="562" y2="140" stroke="#9ca3af" stroke-width="1"/>
  <line x1="562" y1="140" x2="589" y2="140" stroke="#9ca3af" stroke-width="1"/>
  <text x="554" y="150" text-anchor="start" font-family="Arial" font-size="8" fill="#666">数据</text>

  <!-- TFT 开关管 -->
  <rect x="589" y="130" width="34" height="20" rx="3" fill="#e5e7eb" stroke="#666" stroke-width="1"/>
  <text x="606" y="144" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">TFT</text>
  <line x1="606" y1="124" x2="606" y2="130" stroke="#9ca3af" stroke-width="1"/>

  <!-- 存储电容：TFT 输出节点上并联 -->
  <line x1="606" y1="150" x2="606" y2="196" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="606" y1="164" x2="634" y2="164" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="634" y1="158" x2="634" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="640" y1="158" x2="640" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <text x="648" y="180" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">存储</text>
  <text x="648" y="190" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">电容</text>

  <!-- OLED 发光单元 -->
  <circle cx="606" cy="206" r="10" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="591" y1="200" x2="586" y2="197"/>
    <line x1="591" y1="212" x2="586" y2="215"/>
  </g>
  <text x="606" y="230" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">OLED（持续发光）</text>

  <!-- 底部说明 -->
  <text x="510" y="304" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">每个像素由 TFT 开关与存储电容维持状态，写入后持续发光</text>
  <text x="510" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">规模不受扫描方式限制，可实现高分辨率全彩显示</text>
  <!-- Copyright 2026 Waveshare. Author: Wulu. Source: https://docs.waveshare.net/ESP32-Peripheral-Tutorials/Display/AMOLED -->
</svg>